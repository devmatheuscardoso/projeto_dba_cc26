<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Funcionários</title>
    <link rel="icon" type="image/png" href="../imagem/favicon.png">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* ===== DASHBOARD LAYOUT ===== */
        .dashboard-wrapper {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .dashboard-header {
            text-align: center;
            margin-bottom: 32px;
            opacity: 0;
            animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .dashboard-header .icone-consulta {
            font-size: 48px;
            margin-bottom: 12px;
        }

        /* ===== CARD SECTION ===== */
        .card-section {
            background: var(--surface-color);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--surface-border);
            padding: 28px;
            margin-bottom: 20px;
            opacity: 0;
            animation: slideUpFade 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .card-section:nth-child(2) { animation-delay: 0.1s; }
        .card-section:nth-child(3) { animation-delay: 0.2s; }

        .card-section-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--surface-border);
        }

        /* ===== SEARCH BAR ===== */
        .search-row {
            display: flex;
            gap: 12px;
        }

        .search-row input {
            flex: 1;
            height: 48px;
            padding: 0 18px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            border: 1px solid var(--surface-border);
            border-radius: var(--radius-md);
            outline: none;
            transition: all var(--transition-fast);
            color: var(--text-primary);
            background: var(--bg-color);
        }

        .search-row input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
            background: white;
        }

        .search-row .botao {
            height: 48px;
            padding: 0 24px;
            font-size: 15px;
            background: var(--primary-color);
            animation: pulseGlow 3s infinite;
        }

        .search-row .botao:hover {
            background: var(--primary-hover);
            animation: none;
        }

        /* ===== ACTION GRID ===== */
        .action-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 18px 12px;
            border: none;
            border-radius: var(--radius-lg);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: white;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }

        .action-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.1);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .action-btn:hover { transform: translateY(-3px) scale(1.02); box-shadow: var(--shadow-lg); }
        .action-btn:hover::before { opacity: 1; }
        .action-btn:active { transform: translateY(0) scale(0.98); }

        .action-btn .btn-icon { font-size: 26px; line-height: 1; }
        .action-btn .btn-label { line-height: 1.2; text-align: center; }

        .action-btn.add    { background: linear-gradient(135deg, #10b981, #059669); }
        .action-btn.update { background: linear-gradient(135deg, #2563eb, #1d4ed8); }
        .action-btn.delete { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .action-btn.retirada  { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .action-btn.devolucao { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }
        .action-btn.estoque   { background: linear-gradient(135deg, #334155, #1e293b); }

        @media (max-width: 600px) {
            .action-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>

<body>

    <!-- Barra superior -->
    <header class="barra-superior">
        <div class="titulo-sistema">🏗️ Sistema de Gestão de EPIs</div>
        <button class="botao-sair" onclick="fazerLogout()">🚪 Sair</button>
    </header>

    <div class="dashboard-wrapper">

        <!-- Cabeçalho do dashboard -->
        <div class="dashboard-header">
            <div class="icone-consulta">👥</div>
            <h1>Painel de Controle</h1>
            <p class="subtitulo">Gerencie funcionários e controle o estoque de EPIs</p>
        </div>

        <!-- Card: Busca de funcionário -->
        <div class="card-section">
            <div class="card-section-title">🔍 Consultar Funcionário</div>
            <div class="search-row">
                <input
                    type="text"
                    id="nome-pesquisa"
                    placeholder="Digite o nome, CPF ou matrícula do funcionário..."
                >
                <button
                    class="botao botao-consultar"
                    onclick="consultarUsuario()"
                >
                    🔍 &nbsp; Consultar
                </button>
            </div>
        </div>

        <!-- Card: Ações de Cadastro -->
        <div class="card-section">
            <div class="card-section-title">👤 Gerenciar Funcionários</div>
            <div class="action-grid">

                <button class="action-btn add" onclick="abrirAdicionar()">
                    <span class="btn-icon">➕</span>
                    <span class="btn-label">Adicionar Funcionário</span>
                </button>

                <button class="action-btn update" onclick="abrirAtualizar()">
                    <span class="btn-icon">✏️</span>
                    <span class="btn-label">Atualizar Cadastro</span>
                </button>

                <button class="action-btn delete" onclick="abrirDeletar()">
                    <span class="btn-icon">🗑️</span>
                    <span class="btn-label">Deletar Funcionário</span>
                </button>

                <button class="action-btn retirada" onclick="abrirRetiradaEPI()">
                    <span class="btn-icon">📤</span>
                    <span class="btn-label">Retirada de EPI</span>
                </button>

                <button class="action-btn devolucao" onclick="abrirDevolucaoEPI()">
                    <span class="btn-icon">↩️</span>
                    <span class="btn-label">Devolução de EPI</span>
                </button>

                <button class="action-btn estoque" onclick="abrirEstoque()">
                    <span class="btn-icon">📦</span>
                    <span class="btn-label">Ver Estoque</span>
                </button>

            </div>
        </div>

    </div>

    <script src="../js/script.js"></script>

</body>

</html>
