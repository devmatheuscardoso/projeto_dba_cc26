<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Funcionário</title>
    <link rel="icon" type="image/png" href="../imagem/favicon.png">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- Barra superior -->
    <header class="barra-superior">
        <div class="titulo-sistema">
            👥 &nbsp; Adicionar Funcionário
        </div>
        <button class="botao-sair" onclick="fazerLogout()">
            🚪 Sair
        </button>
    </header>

    <!-- Botão voltar -->
    <button class="botao-voltar" onclick="voltarConsulta()">
        ← &nbsp; Voltar
    </button>

    <!-- Conteúdo -->
    <main class="editar-container">

        <div class="titulo-pagina">
            <div class="icone-editar">
                👤+
            </div>
            <h1>Adicionar Funcionário</h1>
            <p>
                Preencha os dados abaixo para cadastrar um novo colaborador no sistema.
            </p>
        </div>

        <!-- Matrícula -->
        <div class="formulario-linha">
            <label for="matricula">Matrícula:</label>
            <input type="text" id="matricula" oninput="aplicarMascaraMatricula(this)" placeholder="Digite a matrícula (ex: FUNC-006)...">
        </div>

        <!-- Nome -->
        <div class="formulario-linha">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" placeholder="Digite o nome completo...">
        </div>

        <!-- CPF -->
        <div class="formulario-linha">
            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" oninput="aplicarMascaraCPF(this)" placeholder="Digite o CPF (ex: 123.456.789-00)...">
        </div>

        <!-- Email -->
        <div class="formulario-linha">
            <label for="email">E-mail:</label>
            <input type="email" id="email" placeholder="Digite o e-mail corporativo...">
        </div>

        <!-- Telefone -->
        <div class="formulario-linha">
            <label for="telefone">Telefone:</label>
            <input type="text" id="telefone" oninput="aplicarMascaraTelefone(this)" placeholder="Digite o telefone com DDD...">
        </div>

        <!-- Setor -->
        <div class="formulario-linha">
            <label for="setor_id">Setor:</label>
            <select id="setor_id" style="flex: 1; height: 48px; padding: 0 16px; border: 1px solid var(--surface-border); border-radius: var(--radius-md); font-family: 'Inter', sans-serif;">
                <option value="">Carregando setores...</option>
            </select>
        </div>

        <!-- Profissão -->
        <div class="formulario-linha">
            <label for="profissao">Profissão:</label>
            <input type="text" id="profissao" placeholder="Digite a profissão do funcionário...">
        </div>

        <!-- Botão Adicionar -->
        <div class="botoes-edicao" style="justify-content: center; margin-top: 20px;">
            <button class="botao botao-adicionar" onclick="adicionarUsuario()" style="width: 100%; max-width: 400px;">
                👤+ &nbsp; Cadastrar Funcionário
            </button>
        </div>

        <!-- Container para redirecionamento em caso de registro inativo -->
        <div class="botoes-edicao" id="container-redirecionar-atualizar" style="justify-content: center; display: none; margin-top: 15px;">
            <button type="button" class="botao botao-atualizar" onclick="irParaAtualizar()" style="width: 100%; max-width: 400px;">
                🔄 &nbsp; Ir para Atualizar / Reativar Cadastro
            </button>
        </div>

        <p id="mensagem-edicao"></p>

    </main>

    <script src="../js/script.js"></script>

</body>

</html>
