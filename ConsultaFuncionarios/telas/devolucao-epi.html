<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devolução de EPI</title>
    <link rel="icon" type="image/png" href="../imagem/favicon.png">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .page-container {
            width: 95%;
            max-width: 800px;
            margin: 40px auto;
        }

        .page-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 24px;
            opacity: 0;
            animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .page-header .icon-back {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: white;
            border: 1px solid var(--surface-border);
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all var(--transition-fast);
            text-decoration: none;
        }
        .page-header .icon-back:hover {
            background: var(--bg-color);
            color: var(--text-primary);
        }

        .form-card {
            background: var(--surface-color);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--surface-border);
            padding: 32px;
            margin-bottom: 24px;
            opacity: 0;
            animation: slideUpFade 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
        }

        .form-card-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 24px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--surface-border);
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .input-group label {
            width: 90px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            text-align: right;
        }

        .input-group input, .input-group select {
            flex: 1;
            height: 48px;
            padding: 0 16px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            border: 1px solid var(--surface-border);
            border-radius: var(--radius-md);
            outline: none;
            transition: all var(--transition-fast);
            background: var(--bg-color);
            color: var(--text-primary);
        }

        .input-group input:focus, .input-group select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
            background: white;
        }

        .btn-search {
            height: 48px;
            padding: 0 20px;
            font-size: 14px;
            background: var(--primary-color);
            border-radius: var(--radius-md);
            color: white;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        .btn-search:hover { background: var(--primary-hover); transform: translateY(-2px); }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--surface-border);
        }
        
        .botao-devolver-epi {
            background: var(--primary-color);
            color: white;
            padding: 12px 24px;
            border-radius: var(--radius-md);
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        .botao-devolver-epi:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }
        
        #mensagem-devolucao {
            text-align: right;
            margin-top: 12px;
            font-size: 14px;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <!-- Barra superior -->
    <header class="barra-superior">
        <div class="titulo-sistema">🪖 Devolução de EPI</div>
        <button class="botao-sair" onclick="fazerLogout()">🚪 Sair</button>
    </header>

    <main class="page-container">
        <!-- Botão Voltar e Título da Página -->
        <div class="page-header">
            <button class="icon-back" onclick="voltarConsulta()">← Voltar</button>
            <div>
                <h1 style="margin:0; font-size:26px;">Devolução de Equipamentos</h1>
                <p style="font-size:13px; color:var(--text-secondary); margin:0;">Informe o CPF para ver os EPIs retirados e registar devolução</p>
            </div>
        </div>

        <!-- Card do Formulário -->
        <div class="form-card">
            <div class="form-card-title">🔄 Dados da Devolução</div>

            <!-- CPF -->
            <div class="input-group">
                <label for="cpf-devolucao">CPF:</label>
                <input type="text" id="cpf-devolucao" placeholder="Digite o CPF..." maxlength="14" oninput="aplicarMascaraCPF(this)">
                <button class="btn-search" onclick="buscarItensParaDevolucao()">🔍 Buscar</button>
            </div>

            <!-- EPI -->
            <div class="input-group">
                <label for="epi-devolucao">EPI:</label>
                <select id="epi-devolucao">
                    <option value="">Busque o CPF primeiro...</option>
                </select>
            </div>

            <!-- Quantidade -->
            <div class="input-group">
                <label for="quantidade-devolucao">Quantidade:</label>
                <input type="number" id="quantidade-devolucao" min="1" placeholder="Qtd. devolvida...">
            </div>

            <!-- Ações -->
            <div class="form-actions">
                <button class="botao-devolver-epi" onclick="realizarDevolucao()">
                    🔄 Registrar Devolução
                </button>
            </div>

            <div id="mensagem-devolucao"></div>
        </div>
    </main>

    <script src="../js/script.js"></script>
</body>
</html>
