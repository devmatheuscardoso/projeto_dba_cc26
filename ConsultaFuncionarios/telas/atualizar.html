<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualizar Cadastro de Funcionário</title>
    <link rel="icon" type="image/png" href="../imagem/favicon.png">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- Barra superior -->
    <header class="barra-superior">
        <div class="titulo-sistema">
            📝 &nbsp; Atualizar Cadastro
        </div>
        <button class="botao-sair" onclick="fazerLogout()">
            🚪 Sair
        </button>
    </header>

    <!-- Botão voltar -->
    <button class="botao-voltar" onclick="voltarConsulta()">
        ← &nbsp; Voltar
    </button>

    <!-- Conteúdo -->
    <main class="editar-container">

        <div class="titulo-pagina">
            <div class="icone-editar">
                📝
            </div>
            <h1>Atualizar Cadastro</h1>
            <p>
                Informe o CPF ou Matrícula do funcionário para carregar os dados, altere as informações e clique em salvar.
            </p>
        </div>

        <!-- Etapa 1: CPF / Matrícula -->
        <div class="formulario-linha">
            <label for="cpf">CPF / Matrícula:</label>
            <input type="text" id="cpf" oninput="aplicarMascaraCPF(this)" placeholder="Digite o CPF ou Matrícula do funcionário...">
            <button type="button" class="botao botao-atualizar" onclick="buscarUsuarioPorCPF()" style="margin-left: 10px; width: auto; padding: 12px 20px; font-size: 15px;">
                🔍 Buscar
            </button>
        </div>

        <!-- Etapa 2: Dados do Funcionário (ocultos até a busca) -->
        <div id="secao-dados-usuario" style="display: none;">

            <!-- Matrícula -->
            <div class="formulario-linha">
                <label for="matricula">Matrícula:</label>
                <input type="text" id="matricula" oninput="aplicarMascaraMatricula(this)" placeholder="Matrícula (ex: FUNC-001)...">
            </div>

            <!-- Nome -->
            <div class="formulario-linha">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" placeholder="Nome completo...">
            </div>

            <!-- Email -->
            <div class="formulario-linha">
                <label for="email">E-mail:</label>
                <input type="email" id="email" placeholder="E-mail corporativo...">
            </div>

            <!-- Telefone -->
            <div class="formulario-linha">
                <label for="telefone">Telefone:</label>
                <input type="text" id="telefone" oninput="aplicarMascaraTelefone(this)" placeholder="Telefone com DDD...">
            </div>

            <!-- Setor -->
            <div class="formulario-linha">
                <label for="setor_id">Setor:</label>
                <select id="setor_id" style="flex: 1; height: 48px; padding: 0 16px; border: 1px solid var(--surface-border); border-radius: var(--radius-md); font-family: 'Inter', sans-serif;">
                    <option value="">Selecione o setor...</option>
                </select>
            </div>

            <!-- Profissão -->
            <div class="formulario-linha">
                <label for="profissao">Profissão:</label>
                <input type="text" id="profissao" placeholder="Profissão do funcionário...">
            </div>

        </div>

        <!-- Botões de Ação (ocultos até a verificação) -->
        <div class="botoes-edicao" id="container-botao-atualizar" style="justify-content: center; display: none; gap: 10px; flex-wrap: wrap; margin-top: 20px;">

            <button class="botao botao-atualizar" id="btn-salvar-atualizar" onclick="atualizarUsuario()" style="width: 100%; max-width: 400px;">
                📝 &nbsp; Salvar Alterações
            </button>

            <button class="botao botao-adicionar" id="btn-reativar-usuario" onclick="reativarUsuario()" style="width: 100%; max-width: 400px; display: none; background-color: #27ae60;">
                🔄 &nbsp; Reativar e Atualizar Cadastro
            </button>

        </div>

        <p id="mensagem-edicao"></p>

    </main>

    <script src="../js/script.js"></script>

</body>

</html>
