<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Atualizar Cadastro</title>

    <link rel="icon" type="image/png" href="../imagem/favicon.png">
    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <!-- Barra superior -->
    <header class="barra-superior">

        <div class="titulo-sistema">
            📝 &nbsp; Atualizar Cadastro
        </div>

        <button class="botao-sair" onclick="fazerLogout()">
            🚪 Sair
        </button>

    </header>


    <!-- Botão voltar -->
    <button class="botao-voltar" onclick="voltarConsulta()">
        ← &nbsp; Voltar
    </button>


    <!-- Conteúdo -->
    <main class="editar-container">

        <div class="titulo-pagina">

            <div class="icone-editar">
                📝
            </div>

            <h1>Atualizar Cadastro</h1>

            <p>
                Informe o CPF do usuário para carregar os dados, altere as informações e clique em salvar.
            </p>

        </div>


        <!-- Etapa 1: CPF -->
        <div class="formulario-linha">

            <label for="cpf">
                CPF:
            </label>

            <input type="text" id="cpf" oninput="aplicarMascaraCPF(this)" placeholder="Digite o CPF do usuário a ser atualizado...">

            <button type="button" class="botao botao-atualizar" onclick="buscarUsuarioPorCPF()" style="margin-left: 10px; width: auto; padding: 12px 20px; font-size: 15px;">
                🔍 Buscar CPF
            </button>

        </div>


        <!-- Etapa 2: Nome e Profissão (ocultos até a verificação do CPF) -->
        <div id="secao-dados-usuario" style="display: none;">

            <!-- Nome -->
            <div class="formulario-linha">

                <label for="nome">
                    Nome:
                </label>

                <input type="text" id="nome" placeholder="Nome do usuário...">

            </div>


            <!-- Profissão -->
            <div class="formulario-linha">

                <label for="profissao">
                    Profissão:
                </label>

                <input type="text" id="profissao" placeholder="Profissão do usuário...">

            </div>

        </div>


        <!-- Botão Atualizar (oculto até a verificação do CPF) -->
        <div class="botoes-edicao" id="container-botao-atualizar" style="justify-content: center; display: none; gap: 10px; flex-wrap: wrap;">

            <button class="botao botao-atualizar" id="btn-salvar-atualizar" onclick="atualizarUsuario()" style="width: 100%; max-width: 400px;">
                📝 &nbsp; Salvar Alterações
            </button>

            <button class="botao botao-adicionar" id="btn-reativar-usuario" onclick="reativarUsuario()" style="width: 100%; max-width: 400px; display: none; background-color: #27ae60;">
                🔄 &nbsp; Reativar e Atualizar Usuário
            </button>

        </div>


        <p id="mensagem-edicao"></p>

    </main>


    <script src="../js/script.js"></script>

</body>

</html>
