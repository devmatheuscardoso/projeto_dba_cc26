<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Consulta de Usuários</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <!-- Barra superior -->
    <header class="barra-superior">

        <div class="titulo-sistema">
            🔎 Sistema de Consulta de Usuários
        </div>

        <button class="botao-sair" onclick="fazerLogout()">
            🚪 Sair
        </button>

    </header>


    <!-- Ações de Gerenciamento -->
    <div style="display: flex; gap: 15px; justify-content: center; margin-top: 25px; flex-wrap: wrap;">

        <button class="botao botao-adicionar" onclick="abrirAdicionar()" style="padding: 10px 20px; font-size: 16px;">
            👤+ &nbsp; Adicionar Usuário
        </button>

        <button class="botao botao-atualizar" onclick="abrirAtualizar()" style="padding: 10px 20px; font-size: 16px;">
            📝 &nbsp; Atualizar Cadastro
        </button>

        <button class="botao botao-deletar" onclick="abrirDeletar()" style="padding: 10px 20px; font-size: 16px;">
            🗑 &nbsp; Deletar Usuário
        </button>

    </div>


    <!-- Conteúdo -->
    <main class="consulta-container" style="margin-top: 30px;">

        <div class="icone-consulta">
            👤🔎
        </div>

        <h1>Consulta de Usuários</h1>

        <p class="subtitulo">
            Digite o nome ou o CPF do usuário para consultar.
        </p>


        <div class="consulta-area">

            <input
                type="text"
                id="nome-pesquisa"
                placeholder="Digite o nome ou CPF do usuário..."
            >

            <button
                class="botao botao-consultar"
                onclick="consultarUsuario()"
            >
                🔍 &nbsp; Consultar
            </button>

        </div>

    </main>


    <script src="../js/script.js"></script>

</body>

</html>
